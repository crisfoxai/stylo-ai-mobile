name: iOS Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Run Flutter Analyze
        run: flutter analyze
      
      - name: Run Unit Tests
        run: flutter test --coverage
      
      - name: Build iOS App (Simulator)
        run: flutter build ios --debug --simulator --no-codesign
      
      - name: Start iOS Simulator
        run: |
          xcrun simctl list devices
          DEVICE_ID=$(xcrun simctl create "iPhone 15 Simulator" "iPhone 15" "com.apple.CoreSimulator.SimRuntime.iOS-18-0" || echo "iPhone 15")
          xcrun simctl boot "$DEVICE_ID" || true
          sleep 30
      
      - name: Run iOS Integration Tests
        run: |
          flutter drive \
            --target=test_driver/integration_test.dart \
            --driver=test_driver/integration_test.dart \
            -d "iPhone 15 Simulator" || true
        continue-on-error: true
      
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-debug
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  test-summary:
    runs-on: ubuntu-latest
    needs: build-ios
    if: always()
    steps:
      - name: Download Coverage
        uses: actions/download-artifact@v4
        with:
          name: ios-coverage
          continue-on-error: true
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ iOS Build & Test completed. Artifact available in workflow summary.'
            })
        continue-on-error: true
